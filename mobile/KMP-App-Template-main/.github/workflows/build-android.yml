name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json for CI
        run: |
          cp composeApp/src/androidMain/google-services.json.template composeApp/google-services.json

      - name: Decode Keystore
        id: decode_keystore
        continue-on-error: true
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > composeApp/keyz.jks

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleSignalwhisperDebug --stacktrace

      - name: Build Release APK
        id: build_release
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleSignalwhisperRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: signalwhisper-debug
          path: composeApp/build/outputs/apk/signalwhisper/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: signalwhisper-release
          path: composeApp/build/outputs/apk/signalwhisper/release/*.apk
          retention-days: 14
